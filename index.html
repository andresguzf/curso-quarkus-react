<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" />
    <script>
      // Aplica el tema antes del primer pintado, sin parpadeo: la elección guardada por useThemeStore
      // o, si no hay, la del sistema. Después lo mantiene useThemeStore
      ;(function () {
        var theme
        try {
          theme = JSON.parse(localStorage.getItem('theme-preference')).state.theme
        } catch (error) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.classList.toggle('dark', theme === 'dark')
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#020617' : '#f5f5f7'
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Gestión de clientes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
